<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PotTabletLite overlay</title>
<style>
  /* Tweak these to restyle the overlay. */
  :root {
    --width: 360px;        /* tablet width on screen; height follows the tablet's 4:3 shape */
    --right: 40px;         /* gap from the right edge */
    --tablet: rgba(20, 20, 24, 0.75);
    --tablet-edge: rgba(255, 255, 255, 0.25);
    --area: rgba(77, 163, 255, 0.18);
    --area-edge: rgba(77, 163, 255, 0.9);
    --pen: #ffffff;
    --pen-touch: #ff5ca8;  /* dot and trail colour while the tip touches */
    --keys-panel: rgba(14, 14, 20, 0.7);
    --key-1: #5aa9ff;      /* first key (E): box, bars and BPM */
    --key-2: #5ee08a;      /* second key (R) */
    --key-text: #ffffff;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  #overlay {
    position: absolute;
    right: var(--right);
    top: 50%;
    transform: translateY(-50%);
    width: var(--width);
  }
  canvas { display: block; width: 100%; }
  /* Keys slide up and fade in (with a little overshoot) when a map starts, and sink and
     fade out when it ends. They keep their space, so the tablet never moves. */
  #keys {
    margin-bottom: 10px;
    transform-origin: 50% 100%;
    transition: opacity 280ms ease-out, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 280ms ease-out;
  }
  #keys.hidden {
    opacity: 0;
    transform: translateY(14px) scale(0.92);
    filter: blur(4px);
    transition: opacity 200ms ease-in, transform 200ms ease-in, filter 200ms ease-in;
  }
</style>
</head>
<body>
<div id="overlay">
  <canvas id="keys" class="hidden"></canvas>
  <canvas id="c"></canvas>
</div>
<script>
  const TRAIL_MS = 250;  // how long the trail lasts
  const ONLY_WHILE_PLAYING = true;  // show keys only during a map (osu! stable); false = always
  const FLASH_MS = 60;   // minimum length of a press, so very short taps are still visible
  const SCROLL = 0.25;   // press bars scroll speed, CSS pixels per ms
  const ROW = 34, GAP = 8, PAD = 8;  // key row height, space between rows, panel padding (CSS px)
  const keysEl = document.getElementById("keys");
  const kctx = keysEl.getContext("2d");
  const keys = {};       // name -> {presses, down, bars: [{start, end}], taps: [times]}
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const color = name => css.getPropertyValue(name).trim();

  let state = null;   // last message from the driver
  let pageVersion = null;  // overlay.html version this page was loaded as
  let pen = null;     // current pen {x, y, t, touch} in canvas pixels
  let trail = [];     // recent pen positions

  function size() {
    if (!state) return;
    const [wMm, hMm] = state.tablet;
    const w = canvas.clientWidth * devicePixelRatio;
    canvas.width = w;
    canvas.height = w * hMm / wMm;
    canvas.style.height = canvas.clientWidth * hMm / wMm + "px";
  }

  const events = new EventSource("/events");
  events.onmessage = e => {
    const first = !state;
    state = JSON.parse(e.data);
    // The driver was updated (it reconnects after a restart) or overlay.html edited: load the new page.
    if (pageVersion !== null && pageVersion !== state.page) return location.reload();
    pageVersion = state.page;
    if (first) size();
    updateKeys();
    if (state.pen) {
      const [x, y, touch] = state.pen;
      const [, , maxX, maxY] = state.tablet;
      pen = {x: x / maxX * canvas.width, y: y / maxY * canvas.height, t: performance.now(), touch};
      trail.push(pen);
    } else {
      pen = null;
    }
  };
  events.onerror = () => { state = null; pen = null; trail = []; keysEl.classList.add("hidden"); };  // driver stopped; EventSource retries by itself
  addEventListener("resize", size);

  function updateKeys() {
    keysEl.classList.toggle("hidden", ONLY_WHILE_PLAYING && !state.playing);
    const now = performance.now();
    for (const [name, down, presses] of state.keys) {
      const k = keys[name] ??= {presses, down: false, bars: [], taps: []};
      const open = k.bars.at(-1);
      if (presses !== k.presses) {
        if (open && open.end === null) open.end = now;
        // A tap can start and end between two updates; the count change still shows it.
        k.bars.push({start: now, end: down ? null : now + FLASH_MS});
        k.taps.push(now);
      } else if (!down && open && open.end === null) {
        open.end = Math.max(now, open.start + FLASH_MS);
      }
      k.presses = presses;
      k.down = down;
    }
  }

  function bpm(k, now) {
    // osu! counts streams in 1/4 notes: one tap every 15000/bpm ms.
    k.taps = k.taps.filter(t => now - t < 1000);
    const n = k.taps.length;
    return n < 2 ? 0 : Math.round(15000 * (n - 1) / (k.taps[n - 1] - k.taps[0]));
  }

  function drawKeys(now) {
    const names = Object.keys(keys);
    const r = devicePixelRatio;
    const h = PAD * 2 + names.length * ROW + (names.length - 1) * GAP;
    if (keysEl.height !== Math.round(h * r)) {
      keysEl.width = keysEl.clientWidth * r;
      keysEl.height = Math.round(h * r);
      keysEl.style.height = h + "px";
    }
    const c = kctx, w = keysEl.width / r;
    c.setTransform(r, 0, 0, r, 0, 0);
    c.clearRect(0, 0, w, h);
    c.fillStyle = color("--keys-panel");
    c.beginPath();
    c.roundRect(0, 0, w, h, 12);
    c.fill();

    const boxX = 64, box = ROW - 4, laneX = 150, laneW = w - laneX - PAD;
    names.forEach((name, i) => {
      const k = keys[name];
      const accent = color("--key-" + (i + 1)) || color("--key-1");
      const y = PAD + i * (ROW + GAP), mid = y + ROW / 2;
      const lit = k.down || (k.bars.length && k.bars.at(-1).end > now);
      c.textBaseline = "middle";

      const b = bpm(k, now);
      c.font = "600 13px 'Segoe UI', sans-serif";
      c.textAlign = "right";
      c.fillStyle = accent;
      c.globalAlpha = b ? 1 : 0.4;
      c.fillText(b + "bpm", boxX - 8, mid);
      c.globalAlpha = 1;

      c.save();
      c.beginPath();
      c.roundRect(boxX, mid - box / 2, box, box, 7);
      c.lineWidth = 2;
      c.strokeStyle = accent;
      if (lit) {
        c.shadowColor = accent;
        c.shadowBlur = 14;
        c.fillStyle = accent;
        c.fill();
      } else {
        c.fillStyle = "rgba(0, 0, 0, 0.35)";
        c.fill();
      }
      c.stroke();
      c.restore();
      c.font = "700 16px 'Segoe UI', sans-serif";
      c.textAlign = "center";
      c.fillStyle = lit ? "#0e0e14" : accent;
      c.fillText(name, boxX + box / 2, mid + 1);

      c.font = "600 15px 'Segoe UI', sans-serif";
      c.textAlign = "left";
      c.fillStyle = color("--key-text");
      c.fillText(k.presses, boxX + box + 8, mid);

      // Press bars start at the lane's left edge and scroll right, fading out.
      k.bars = k.bars.filter(p => p.end === null || (now - p.end) * SCROLL < laneW);
      const fade = c.createLinearGradient(laneX, 0, laneX + laneW, 0);
      fade.addColorStop(0, accent);
      fade.addColorStop(1, "transparent");
      c.save();
      c.beginPath();
      c.rect(laneX, y, laneW, ROW);
      c.clip();
      c.fillStyle = fade;
      c.shadowColor = accent;
      c.shadowBlur = 8;
      for (const p of k.bars) {
        const x0 = laneX + (now - Math.min(p.end ?? now, now)) * SCROLL;
        const x1 = laneX + (now - p.start) * SCROLL;
        c.beginPath();
        c.roundRect(x0, mid - ROW * 0.3, Math.max(x1 - x0, 3), ROW * 0.6, 4);
        c.fill();
      }
      c.restore();
    });
  }

  function draw(now) {
    requestAnimationFrame(draw);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!state) return;
    drawKeys(now);

    const s = canvas.width / state.tablet[0];  // canvas pixels per mm
    const line = Math.max(1, s * 0.4);

    ctx.fillStyle = color("--tablet");
    ctx.strokeStyle = color("--tablet-edge");
    ctx.lineWidth = line;
    ctx.beginPath();
    ctx.roundRect(line / 2, line / 2, canvas.width - line, canvas.height - line, s * 3);
    ctx.fill();
    ctx.stroke();

    const a = state.area;
    ctx.save();
    ctx.translate(a.x * s, a.y * s);
    ctx.rotate(a.rotation * Math.PI / 180);
    ctx.fillStyle = color("--area");
    ctx.strokeStyle = color("--area-edge");
    ctx.fillRect(-a.width * s / 2, -a.height * s / 2, a.width * s, a.height * s);
    ctx.strokeRect(-a.width * s / 2, -a.height * s / 2, a.width * s, a.height * s);
    ctx.restore();

    trail = trail.filter(p => now - p.t < TRAIL_MS);
    ctx.lineCap = "round";
    for (let i = 1; i < trail.length; i++) {
      const p = trail[i - 1], q = trail[i];
      const life = 1 - (now - q.t) / TRAIL_MS;
      ctx.globalAlpha = life;
      ctx.strokeStyle = q.touch ? color("--pen-touch") : color("--pen");
      ctx.lineWidth = s * 1.5 * life;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(q.x, q.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (pen) {
      ctx.fillStyle = pen.touch ? color("--pen-touch") : color("--pen");
      ctx.beginPath();
      ctx.arc(pen.x, pen.y, s * (pen.touch ? 2.2 : 1.6), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
