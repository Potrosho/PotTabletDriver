<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PotTabletLite overlay</title>
<style>
  /* Tweak these to restyle the overlay. */
  :root {
    --width: 360px;        /* tablet width on screen; height follows the tablet's 4:3 shape */
    --right: 40px;         /* gap from the right edge */
    --tablet: rgba(20, 20, 24, 0.75);
    --tablet-edge: rgba(255, 255, 255, 0.25);
    --area: rgba(77, 163, 255, 0.18);
    --area-edge: rgba(77, 163, 255, 0.9);
    --area-out: #ff5c5c;   /* area outline glow while the pen is outside the area */
    --heat: #ffb347;       /* heatmap: where the pen spends its time */
    --heatmap-width: 50%;  /* heatmap tablet size, relative to the main tablet */
    --pen: #ffffff;
    --pen-touch: #ff5ca8;  /* dot and trail colour while the tip touches */
    --keys-panel: rgba(14, 14, 20, 0.7);
    --key-1: #5aa9ff;      /* first key (E): box, bars and BPM */
    --key-2: #5ee08a;      /* second key (R) */
    --key-text: #ffffff;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  #overlay {
    position: absolute;
    right: var(--right);
    top: 50%;
    transform: translateY(-50%);
    width: var(--width);
  }
  canvas { display: block; width: 100%; }
  #heatmap { width: var(--heatmap-width); margin: 10px 0 0 auto; }  /* small, right-aligned under the tablet */
  /* Keys slide up and fade in (with a little overshoot) when a map starts, and sink and
     fade out when it ends. They keep their space, so the tablet never moves. */
  #play {
    margin-bottom: 10px;
    transform-origin: 50% 100%;
    transition: opacity 280ms ease-out, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 280ms ease-out;
  }
  #play.hidden {
    opacity: 0;
    transform: translateY(14px) scale(0.92);
    filter: blur(4px);
    transition: opacity 200ms ease-in, transform 200ms ease-in, filter 200ms ease-in;
  }
  #now {
    margin-bottom: 8px;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--keys-panel);
    color: var(--key-text);
  }
  #song, #diff { min-height: 1.35em; }  /* fixed height, so the tablet never shifts */
  #song { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #diff { font-size: 12px; color: var(--key-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="overlay">
  <div id="play" class="hidden">
    <div id="now"><div id="song"></div><div id="diff"></div></div>
    <canvas id="keys"></canvas>
  </div>
  <canvas id="c"></canvas>
  <canvas id="heatmap"></canvas>
</div>
<script>
  const TRAIL_MS = 250;  // how long the trail lasts
  const ONLY_WHILE_PLAYING = true;  // show keys only during a map (osu! stable); false = always
  const FLASH_MS = 60;   // minimum length of a press, so very short taps are still visible
  const SCROLL = 0.25;   // press bars scroll speed, CSS pixels per ms
  const ROW = 34, GAP = 8, PAD = 8;  // key row height, space between rows, panel padding (CSS px)
  const HEADER = 30;     // height of the combined BPM / peak line above the key rows
  const HEAT_HALF_LIFE_MS = 20000;  // heatmap fades to half in this time
  const HEAT_STRENGTH = 1.8;        // higher = more of the heatmap shows at full colour
  const OUT_FADE_MS = 300;          // how long the out-of-area glow takes to fade
  const keysEl = document.getElementById("keys");
  const playEl = document.getElementById("play");  // now playing + keys, shown during maps
  const kctx = keysEl.getContext("2d");
  const keys = {};       // name -> {presses, base, down, bars: [{start, end}], taps: [times]}
  const allTaps = {taps: []};  // both keys together, for the combined stream BPM
  let peak = 0;          // highest combined BPM this map
  let wasPlaying = false;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const heatmap = document.getElementById("heatmap");
  const mctx = heatmap.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const color = name => css.getPropertyValue(name).trim();

  let state = null;   // last message from the driver
  let pageVersion = null;  // overlay.html version this page was loaded as
  let pen = null;     // current pen {x, y, t, touch} in canvas pixels
  let trail = [];     // recent pen positions
  let lastOut = -Infinity;  // when the pen was last seen outside the area
  let lastFrame = 0;
  const heat = document.createElement("canvas");  // 1 cell per mm, scaled up and blurred when drawn
  const hctx = heat.getContext("2d");
  let heatGrid = null;

  function size() {
    if (!state) return;
    const [wMm, hMm] = state.tablet;
    if (!heatGrid) {
      heat.width = Math.ceil(wMm);
      heat.height = Math.ceil(hMm);
      heatGrid = new Float32Array(heat.width * heat.height);
    }
    for (const c of [canvas, heatmap]) {
      c.width = c.clientWidth * devicePixelRatio;
      c.height = c.width * hMm / wMm;
      c.style.height = c.clientWidth * hMm / wMm + "px";
    }
  }

  const events = new EventSource("/events");
  events.onmessage = e => {
    const first = !state;
    state = JSON.parse(e.data);
    // The driver was updated (it reconnects after a restart) or overlay.html edited: load the new page.
    if (pageVersion !== null && pageVersion !== state.page) return location.reload();
    pageVersion = state.page;
    if (first) size();
    updateKeys();
    if (state.pen) {
      const [x, y, touch] = state.pen;
      const [, , maxX, maxY] = state.tablet;
      pen = {x: x / maxX * canvas.width, y: y / maxY * canvas.height, t: performance.now(), touch};
      trail.push(pen);
    } else {
      pen = null;
    }
  };
  events.onerror = () => { state = null; pen = null; trail = []; playEl.classList.add("hidden"); };  // driver stopped; EventSource retries by itself
  addEventListener("resize", size);

  function updateKeys() {
    playEl.classList.toggle("hidden", ONLY_WHILE_PLAYING && !state.playing);
    // Keep the last map's name while the panel animates away.
    if (state.map) {
      document.getElementById("song").textContent = state.map[0];
      document.getElementById("diff").textContent = state.map[1];
    }
    // Always visible: no map title in osu!lazer, so the box would only ever be empty.
    if (!ONLY_WHILE_PLAYING) document.getElementById("now").style.display = state.map ? "" : "none";
    const now = performance.now();
    const mapStart = state.playing && !wasPlaying;
    wasPlaying = state.playing;
    if (mapStart) {
      peak = 0;
      allTaps.taps = [];
    }
    for (const [name, down, presses] of state.keys) {
      const k = keys[name] ??= {presses, base: presses, down: false, bars: [], taps: []};
      if (mapStart) {
        k.base = presses;  // counts show this map's presses only
        k.taps = [];
      }
      const open = k.bars.at(-1);
      if (presses !== k.presses) {
        if (open && open.end === null) open.end = now;
        // A tap can start and end between two updates; the count change still shows it.
        k.bars.push({start: now, end: down ? null : now + FLASH_MS});
        k.taps.push(now);
        allTaps.taps.push(now);
      } else if (!down && open && open.end === null) {
        open.end = Math.max(now, open.start + FLASH_MS);
      }
      k.presses = presses;
      k.down = down;
    }
  }

  function bpm(k, now, minTaps = 3) {
    // osu! counts streams in 1/4 notes: one tap every 15000/bpm ms. Needing a few taps
    // keeps a single quick double-tap from reading as a huge BPM.
    k.taps = k.taps.filter(t => now - t < 1000);
    const n = k.taps.length;
    return n < minTaps ? 0 : Math.round(15000 * (n - 1) / (k.taps[n - 1] - k.taps[0]));
  }

  function drawKeys(now) {
    const names = Object.keys(keys);
    const r = devicePixelRatio;
    const h = PAD * 2 + HEADER + names.length * ROW + (names.length - 1) * GAP;
    if (keysEl.height !== Math.round(h * r)) {
      keysEl.width = keysEl.clientWidth * r;
      keysEl.height = Math.round(h * r);
      keysEl.style.height = h + "px";
    }
    const c = kctx, w = keysEl.width / r;
    c.setTransform(r, 0, 0, r, 0, 0);
    c.clearRect(0, 0, w, h);
    c.fillStyle = color("--keys-panel");
    c.beginPath();
    c.roundRect(0, 0, w, h, 12);
    c.fill();

    // Combined stream BPM and this map's peak. The peak only counts real streams (8+ taps).
    const total = bpm(allTaps, now);
    if (allTaps.taps.length >= 8) peak = Math.max(peak, total);
    c.textBaseline = "middle";
    c.textAlign = "left";
    c.font = "700 18px 'Segoe UI', sans-serif";
    c.fillStyle = color("--key-text");
    c.globalAlpha = total ? 1 : 0.4;
    c.fillText(total + " bpm", PAD + 4, PAD + HEADER / 2);
    c.globalAlpha = 1;
    c.textAlign = "right";
    c.font = "600 13px 'Segoe UI', sans-serif";
    c.fillStyle = color("--key-text");
    c.globalAlpha = 0.7;
    c.fillText("peak " + peak, w - PAD - 4, PAD + HEADER / 2);
    c.globalAlpha = 1;

    const boxX = 64, box = ROW - 4, laneX = 150, laneW = w - laneX - PAD;
    names.forEach((name, i) => {
      const k = keys[name];
      const accent = color("--key-" + (i + 1)) || color("--key-1");
      const y = PAD + HEADER + i * (ROW + GAP), mid = y + ROW / 2;
      const lit = k.down || (k.bars.length && k.bars.at(-1).end > now);
      c.textBaseline = "middle";

      const b = bpm(k, now);
      c.font = "600 13px 'Segoe UI', sans-serif";
      c.textAlign = "right";
      c.fillStyle = accent;
      c.globalAlpha = b ? 1 : 0.4;
      c.fillText(b + "bpm", boxX - 8, mid);
      c.globalAlpha = 1;

      c.save();
      c.beginPath();
      c.roundRect(boxX, mid - box / 2, box, box, 7);
      c.lineWidth = 2;
      c.strokeStyle = accent;
      if (lit) {
        c.shadowColor = accent;
        c.shadowBlur = 14;
        c.fillStyle = accent;
        c.fill();
      } else {
        c.fillStyle = "rgba(0, 0, 0, 0.35)";
        c.fill();
      }
      c.stroke();
      c.restore();
      c.font = "700 16px 'Segoe UI', sans-serif";
      c.textAlign = "center";
      c.fillStyle = lit ? "#0e0e14" : accent;
      c.fillText(name, boxX + box / 2, mid + 1);

      c.font = "600 15px 'Segoe UI', sans-serif";
      c.textAlign = "left";
      c.fillStyle = color("--key-text");
      c.fillText(k.presses - k.base, boxX + box + 8, mid);

      // Press bars start at the lane's left edge and scroll right, fading out.
      k.bars = k.bars.filter(p => p.end === null || (now - p.end) * SCROLL < laneW);
      const fade = c.createLinearGradient(laneX, 0, laneX + laneW, 0);
      fade.addColorStop(0, accent);
      fade.addColorStop(1, "transparent");
      c.save();
      c.beginPath();
      c.rect(laneX, y, laneW, ROW);
      c.clip();
      c.fillStyle = fade;
      c.shadowColor = accent;
      c.shadowBlur = 8;
      for (const p of k.bars) {
        const x0 = laneX + (now - Math.min(p.end ?? now, now)) * SCROLL;
        const x1 = laneX + (now - p.start) * SCROLL;
        c.beginPath();
        c.roundRect(x0, mid - ROW * 0.3, Math.max(x1 - x0, 3), ROW * 0.6, 4);
        c.fill();
      }
      c.restore();
    });
  }

  function drawTablet(c, s, a, rot, glow) {
    // Tablet outline and the (possibly rotated) area, with the out-of-area glow.
    const line = Math.max(1, s * 0.4);
    c.fillStyle = color("--tablet");
    c.strokeStyle = color("--tablet-edge");
    c.lineWidth = line;
    c.beginPath();
    c.roundRect(line / 2, line / 2, c.canvas.width - line, c.canvas.height - line, s * 3);
    c.fill();
    c.stroke();

    c.save();
    c.translate(a.x * s, a.y * s);
    c.rotate(rot);
    c.fillStyle = color("--area");
    c.strokeStyle = color("--area-edge");
    c.fillRect(-a.width * s / 2, -a.height * s / 2, a.width * s, a.height * s);
    c.strokeRect(-a.width * s / 2, -a.height * s / 2, a.width * s, a.height * s);
    if (glow) {
      c.globalAlpha = glow;
      c.strokeStyle = c.shadowColor = color("--area-out");
      c.shadowBlur = s * 4;
      c.lineWidth = line * 2;
      c.strokeRect(-a.width * s / 2, -a.height * s / 2, a.width * s, a.height * s);
    }
    c.restore();
  }

  function drawHeat(dt, s) {
    // Collects pen time at main-tablet scale ``s``; draws onto the small heatmap tablet.
    if (!heatGrid) return;
    const gw = heat.width, gh = heat.height;
    const decay = Math.pow(0.5, dt / HEAT_HALF_LIFE_MS);
    let max = 0;
    for (let i = 0; i < heatGrid.length; i++) {
      heatGrid[i] *= decay;
      if (heatGrid[i] > max) max = heatGrid[i];
    }
    if (pen) {
      const cx = Math.floor(pen.x / s), cy = Math.floor(pen.y / s);
      if (cx >= 0 && cy >= 0 && cx < gw && cy < gh) heatGrid[cy * gw + cx] += dt;  // time spent here
    }
    if (!max) return;
    const img = hctx.createImageData(gw, gh);
    for (let i = 0; i < heatGrid.length; i++) img.data[i * 4 + 3] = 220 * Math.min(1, HEAT_STRENGTH * Math.sqrt(heatGrid[i] / max));
    hctx.putImageData(img, 0, 0);
    hctx.globalCompositeOperation = "source-in";  // colour the alpha mask
    hctx.fillStyle = color("--heat");
    hctx.fillRect(0, 0, gw, gh);
    hctx.globalCompositeOperation = "source-over";
    const ms = heatmap.width / state.tablet[0];
    mctx.save();
    mctx.filter = `blur(${ms * 2}px)`;
    mctx.drawImage(heat, 0, 0, gw * ms, gh * ms);
    mctx.restore();
  }

  function draw(now) {
    requestAnimationFrame(draw);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    mctx.clearRect(0, 0, heatmap.width, heatmap.height);
    if (!state) return;
    drawKeys(now);

    const s = canvas.width / state.tablet[0];  // canvas pixels per mm
    const dt = lastFrame ? now - lastFrame : 0;
    lastFrame = now;

    // Is the pen outside the (possibly rotated) area? Check in the area's own coordinates.
    const a = state.area;
    const rot = a.rotation * Math.PI / 180;
    if (pen) {
      const dx = pen.x / s - a.x, dy = pen.y / s - a.y;
      const lx = dx * Math.cos(rot) + dy * Math.sin(rot);
      const ly = -dx * Math.sin(rot) + dy * Math.cos(rot);
      if (Math.abs(lx) > a.width / 2 || Math.abs(ly) > a.height / 2) lastOut = now;
    }
    const glow = Math.max(0, 1 - (now - lastOut) / OUT_FADE_MS);

    drawTablet(ctx, s, a, rot, glow);
    drawTablet(mctx, heatmap.width / state.tablet[0], a, rot, 0);
    drawHeat(dt, s);

    trail = trail.filter(p => now - p.t < TRAIL_MS);
    ctx.lineCap = "round";
    for (let i = 1; i < trail.length; i++) {
      const p = trail[i - 1], q = trail[i];
      const life = 1 - (now - q.t) / TRAIL_MS;
      ctx.globalAlpha = life;
      ctx.strokeStyle = q.touch ? color("--pen-touch") : color("--pen");
      ctx.lineWidth = s * 1.5 * life;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(q.x, q.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (pen) {
      ctx.fillStyle = pen.touch ? color("--pen-touch") : color("--pen");
      ctx.beginPath();
      ctx.arc(pen.x, pen.y, s * (pen.touch ? 2.2 : 1.6), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
